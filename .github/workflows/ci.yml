name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify v1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Verify contract
        working-directory: packages/contract
        run: |
          bun run typecheck
          bun test
          bun run openapi:check

      - name: Verify API
        working-directory: apps/api
        env:
          # Alchemy's local Cloudflare provider still resolves credentials in dev mode;
          # these are deliberately fake because the test never contacts Cloudflare.
          CLOUDFLARE_ACCOUNT_ID: 00000000000000000000000000000000
          CLOUDFLARE_API_TOKEN: kronik-local-test-token
        run: |
          bun run typecheck
          bun test

      - name: Run local Cloudflare integration scenarios
        working-directory: apps/api
        run: bun run test:integration

      - name: Build Fumadocs static site
        working-directory: apps/docs
        run: |
          bun run typecheck
          bun run build
